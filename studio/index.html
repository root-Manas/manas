<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#090909"><title>Blog Studio — Manas</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('manas-theme')||'dark'}catch{}</script><link rel="stylesheet" href="../styles.css?v=6"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="../theme.css?v=1"><script>window.STUDIO_SESSION='__STUDIO_SESSION__';</script><script src="../theme.js?v=1" defer></script><script src="../vendor/marked.min.js" defer></script><script src="../vendor/purify.min.js" defer></script><script src="studio.js" defer></script></head>
<body><div class="studio-shell"><aside class="studio-sidebar glass-card"><a class="studio-brand" href="../index.html"><span class="brand-mark">M<span>∕</span></span><span>MANAS <b>/ STUDIO</b></span></a><button id="new-post" class="button button-primary" type="button">+ New article</button><div class="sidebar-label mono">YOUR ARTICLES</div><div id="post-list" class="post-list">Loading…</div><div class="sidebar-bottom"><span class="status-dot"></span> LOCAL WRITING SPACE</div></aside><main class="studio-main"><div class="studio-top"><div><div class="eyebrow">FIELD NOTES / EDITOR</div><h1>Write something <em>worth sharing.</em></h1></div><a href="../archive.html" target="_blank" rel="noopener" class="button button-ghost">View site ↗</a></div><div id="message" class="studio-message" role="status" aria-live="polite"></div><form id="post-form"><div class="meta-grid"><label>ARTICLE TITLE<input id="title" name="title" required maxlength="180" placeholder="Give your story a title"></label><label>URL SLUG<input id="slug" name="slug" required pattern="[A-Za-z0-9_-]+" placeholder="my-story"></label><label>PUBLISH DATE<input id="date" name="date" type="date" required></label><label>TAGS <small>COMMA SEPARATED</small><input id="tags" name="tags" placeholder="research, systems, ideas"></label></div><label class="summary-label">SHORT SUMMARY<textarea id="description" name="description" required maxlength="400" rows="2" placeholder="A short introduction for the article card"></textarea></label><div class="editor-wrap"><div class="editor-top"><span>STORY</span><span id="word-count">0 WORDS</span></div><div class="toolbar" role="toolbar" aria-label="Writing tools"><button type="button" data-command="formatBlock" data-value="p" title="Paragraph">P</button><button type="button" data-command="formatBlock" data-value="h2" title="Heading 2">H2</button><button type="button" data-command="formatBlock" data-value="h3" title="Heading 3">H3</button><span class="toolbar-divider"></span><button type="button" data-command="bold" title="Bold"><b>B</b></button><button type="button" data-command="italic" title="Italic"><i>I</i></button><button type="button" data-command="insertUnorderedList" title="Bullet list">☰</button><button type="button" data-command="insertOrderedList" title="Numbered list">1.</button><button type="button" data-command="formatBlock" data-value="blockquote" title="Quote">❞</button><button type="button" id="insert-link" title="Insert link">↗ Link</button><button type="button" id="insert-image" title="Add image">▧ Image</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><button type="button" id="insert-code" title="Code block">{ } Code</button></div><div id="editor" class="story-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Article body" data-placeholder="Start writing your story here…"></div></div><div class="studio-actions"><div class="action-hint">Changes stay on this computer until you publish.</div><div class="action-buttons"><button id="preview-button" class="button button-ghost" type="button">Preview ↗</button><button id="save-button" class="button button-ghost" type="submit">Save draft</button><button id="publish-button" class="button button-primary" type="button">Publish to site ↗</button></div></div></form></main></div></body></html>
