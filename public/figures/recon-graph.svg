<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Evidence graph for infrastructure reconnaissance</title><desc id="desc">A fictional organization is connected to DNS, certificate transparency, code repository, and client JavaScript observations. Dashed edges indicate hypotheses rather than verified ownership.</desc><rect width="1000" height="560" fill="#0b0b0b"/><g stroke="#333" stroke-width="1"><path d="M0 80H1000M0 160H1000M0 240H1000M0 320H1000M0 400H1000M0 480H1000M100 0V560M300 0V560M500 0V560M700 0V560M900 0V560"/></g><g fill="none" stroke-width="3"><path d="M500 278L220 166M500 278L780 156M500 278L220 420M500 278L785 414" stroke="#f2f2f2"/><path d="M220 166L780 156M220 420L785 414" stroke="#ef3434" stroke-dasharray="8 8"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><rect x="382" y="229" width="236" height="100" fill="#ef3434"/><text x="500" y="273" fill="#fff" font-size="20">ACME.EXAMPLE</text><text x="500" y="299" fill="#fff" font-size="13">SCOPE ANCHOR</text><rect x="113" y="122" width="214" height="88" fill="#161616" stroke="#777"/><text x="220" y="158" fill="#fff" font-size="18">DNS</text><text x="220" y="183" fill="#aaa" font-size="13">CNAME / TTL / ASN</text><rect x="672" y="112" width="216" height="88" fill="#161616" stroke="#777"/><text x="780" y="147" fill="#fff" font-size="18">CT LOG</text><text x="780" y="174" fill="#aaa" font-size="13">SAN / ISSUER / TIME</text><rect x="113" y="375" width="214" height="88" fill="#161616" stroke="#777"/><text x="220" y="411" fill="#fff" font-size="18">REPOSITORY</text><text x="220" y="438" fill="#aaa" font-size="13">CONFIG / DEPLOY</text><rect x="677" y="370" width="216" height="88" fill="#161616" stroke="#777"/><text x="785" y="406" fill="#fff" font-size="18">CLIENT CODE</text><text x="785" y="433" fill="#aaa" font-size="13">ROUTES / ORIGINS</text><text x="500" y="50" fill="#f2f2f2" font-size="22">INFRASTRUCTURE AS AN EVIDENCE GRAPH</text><text x="500" y="530" fill="#ef3434" font-size="15">DASHED EDGE = HYPOTHESIS, NOT VERIFIED OWNERSHIP</text></g></svg>
