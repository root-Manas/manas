<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Semiconductor production possibilities frontier</title><desc id="desc">A curved frontier shows the short-run trade-off between design capability and fabrication capacity, while a second outward curve represents productivity gains from shared infrastructure.</desc><rect width="1000" height="560" fill="#0b0b0b"/><g stroke="#333" stroke-width="1"><path d="M120 80V460H900"/><path d="M120 365H900M120 270H900M120 175H900M320 80V460M520 80V460M720 80V460" stroke-dasharray="4 8"/></g><path d="M120 460V80M120 460H900" stroke="#f2f2f2" stroke-width="2"/><path d="M145 140C320 160 565 235 755 455" fill="none" stroke="#ef3434" stroke-width="4"/><path d="M145 88C360 100 670 170 870 455" fill="none" stroke="#f0f0f0" stroke-width="3" stroke-dasharray="10 9"/><circle cx="530" cy="287" r="10" fill="#f2f2f2" stroke="#ef3434" stroke-width="4"/><circle cx="640" cy="230" r="10" fill="#ef3434"/><g font-family="Arial,sans-serif" fill="#f2f2f2"><text x="130" y="47" font-size="24" font-weight="700">SHORT-RUN FRONTIER / LONG-RUN SHIFT</text><text x="418" y="524" font-size="20">FABRICATION CAPABILITY →</text><text x="38" y="330" font-size="20" transform="rotate(-90 38 330)">DESIGN CAPABILITY →</text><text x="492" y="270" font-size="16">A / CURRENT MIX</text><text x="655" y="217" font-size="16">B / HIGHER PRODUCTIVITY</text><text x="750" y="330" font-size="16" fill="#ef3434">FIXED RESOURCES</text><text x="754" y="148" font-size="16">OUTWARD SHIFT</text></g></svg>
