<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Cron privilege boundary</title><desc id="desc">A root cron entry resolves a path through directories to a script, then runs helpers and data. A red boundary marks the point where a less privileged user can replace or modify an input.</desc><rect width="900" height="450" fill="#0b0b0b"/><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#252525" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ef3434"/></marker></defs><rect width="900" height="450" fill="url(#grid)"/><text x="48" y="58" fill="#ef3434" font-family="monospace" font-size="20" font-weight="bold">SCHEDULED EXECUTION / TRUST CHAIN</text><text x="48" y="92" fill="#aaa" font-family="monospace" font-size="14">Who can change the bytes before the privileged read?</text><g font-family="monospace" font-size="15"><rect x="50" y="155" width="155" height="92" fill="#151515" stroke="#777"/><text x="68" y="190" fill="#fff">ROOT CRONTAB</text><text x="68" y="219" fill="#aaa">UID 0 / schedule</text><rect x="275" y="155" width="160" height="92" fill="#151515" stroke="#777"/><text x="293" y="190" fill="#fff">PATH WALK</text><text x="293" y="219" fill="#aaa">dirs + symlinks</text><rect x="505" y="155" width="155" height="92" fill="#211010" stroke="#ef3434" stroke-width="2"/><text x="523" y="190" fill="#fff">SCRIPT BYTES</text><text x="523" y="219" fill="#ef3434">replace / edit?</text><rect x="730" y="155" width="120" height="92" fill="#151515" stroke="#777"/><text x="748" y="190" fill="#fff">HELPERS</text><text x="748" y="219" fill="#aaa">imports</text></g><g stroke="#ef3434" stroke-width="3" marker-end="url(#arrow)"><path d="M207 201H267"/><path d="M437 201H497"/><path d="M662 201H722"/></g><path d="M580 263V326" stroke="#ef3434" stroke-width="2" stroke-dasharray="7 7"/><rect x="391" y="326" width="378" height="60" fill="#2a0d0d" stroke="#ef3434"/><text x="412" y="351" fill="#fff" font-family="monospace" font-size="14">LOWER-TRUST WRITER</text><text x="412" y="372" fill="#ddd" font-family="monospace" font-size="12">File, parent directory, PATH entry, or import</text><text x="48" y="426" fill="#999" font-family="monospace" font-size="12">A missing script alone does not cross the boundary.</text></svg>
